name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","itp-light"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate README
        run: test -f profile/README.md && echo "README exists"
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
  repo-hygiene:
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@dd4e7ef8217afa34e70efe4dc6a9289f6b5176b2
    with:
      hygiene-revision: dd4e7ef8217afa34e70efe4dc6a9289f6b5176b2
    permissions:
      contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
