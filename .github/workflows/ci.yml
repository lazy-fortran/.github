name: CI

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","itp-light"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate README
        run: test -f profile/README.md && echo "README exists"
  repo-hygiene:
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@ea1b6401dad136e8b61206fe0647d6ecc772523b
    with:
      hygiene-revision: ea1b6401dad136e8b61206fe0647d6ecc772523b
    permissions:
      contents: read
