name: CI

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate README
        run: test -f profile/README.md && echo "README exists"
  repo-hygiene:
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@04da3fc73d9ead713b93700de7bbf54049b5ac3e
    with:
      hygiene-revision: 04da3fc73d9ead713b93700de7bbf54049b5ac3e
    permissions:
      contents: read
