name: CI

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate README
        run: test -f profile/README.md && echo "README exists"
  repo-hygiene:
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@0663fcdd3b414a741bc3df08959a6f83aedf2d40
    with:
      hygiene-revision: 0663fcdd3b414a741bc3df08959a6f83aedf2d40
    permissions:
      contents: read
